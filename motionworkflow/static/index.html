<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="Main">
    <a class="brand" href="#/">
      <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
      <span class="brand-name">Motion<span>Workflow</span></span>
    </a>
    <nav class="nav" aria-label="Main navigation">
      <a href="#/" data-route="home"><svg class="icon"><use href="#i-home"/></svg>Home</a>
      <div class="nav-group">
        <div class="nav-label">Create</div>
        <a href="#/create/presenter" data-route="create/presenter"><svg class="icon"><use href="#i-presenter"/></svg>Presenter<span class="tag">New</span></a>
        <a href="#/create/short" data-route="create/short"><svg class="icon"><use href="#i-film"/></svg>Short Maker</a>
        <a href="#/create/image" data-route="create/image"><svg class="icon"><use href="#i-image"/></svg>Image</a>
        <a href="#/create/video" data-route="create/video"><svg class="icon"><use href="#i-video"/></svg>Video</a>
        <a href="#/create/voice" data-route="create/voice"><svg class="icon"><use href="#i-wave"/></svg>Voiceover</a>
        <a href="#/create/swap" data-route="create/swap"><svg class="icon"><use href="#i-swap"/></svg>Character Swap</a>
      </div>
      <div class="nav-group">
        <div class="nav-label">Library</div>
        <a href="#/projects" data-route="projects"><svg class="icon"><use href="#i-grid"/></svg>Projects<span class="count" id="navProjects"></span></a>
        <a href="#/assets" data-route="assets"><svg class="icon"><use href="#i-layers"/></svg>Avatars &amp; voices<span class="count" id="navAssets"></span></a>
      </div>
      <div class="nav-group">
        <div class="nav-label">Account</div>
        <a href="#/settings" data-route="settings"><svg class="icon"><use href="#i-settings"/></svg>Settings</a>
      </div>
    </nav>
    <div class="sidebar-foot">
      <div class="meter" aria-live="polite">
        <div class="meter-row"><span>Spent today</span><span><b id="spentToday">$0.00</b> / <span id="dailyBudget">$10</span></span></div>
        <div class="meter-bar"><i id="spentBar"></i></div>
        <div class="providers" id="providerDots"></div>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="btn ghost icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="spacer"></div>
      <div id="topActions" style="display:flex;gap:8px"></div>
    </header>
    <main class="page" id="page" tabindex="-1"></main>
  </div>
</div>

<dialog id="dialog"></dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/static/js/app.js"></script>
