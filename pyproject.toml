[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionworkflow"
version = "0.1.0"
description = "Local studio for cheap AI images, videos, narrated shorts and character swaps."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "requests>=2.31",
  "pillow>=10",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]
ffmpeg = ["imageio-ffmpeg>=0.5"]

[project.scripts]
mw = "motionworkflow.cli:main"

[tool.setuptools]
packages = ["motionworkflow", "motionworkflow.providers", "motionworkflow.workflows"]

[tool.setuptools.package-data]
motionworkflow = ["models.json", "static/*"]
